<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFTE V23.0 — Choix du sport</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Arial, sans-serif;
            background: #0f0f1a;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #ffcc00; text-align: center; font-size: 28px; margin: 8px 0; }
        .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 40px; }
        .choix-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }
        .choix-btn {
            display: block;
            padding: 30px 20px;
            background: #14141f;
            border: 2px solid #262636;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }
        .choix-btn:active { transform: scale(0.98); }
        .choix-btn:hover { border-color: #ffcc00; background: #1a1a2e; }
        .choix-emoji { font-size: 48px; display: block; margin-bottom: 10px; }
        .choix-titre { font-size: 22px; font-weight: bold; color: #ffcc00; margin-bottom: 6px; }
        .choix-desc { font-size: 13px; color: #999; }
        .version { margin-top: 40px; color: #666; font-size: 11px; text-align: center; }
        .lien-historique {
            margin-top: 20px;
            color: #ffcc00;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🦁 QFTE V23.0</h1>
    <p class="subtitle">Bot d'analyse — Standards Sharp-Money</p>

    <div class="choix-container">

        <a href="/football" class="choix-btn">
            <span class="choix-emoji">⚽</span>
            <div class="choix-titre">Football</div>
            <div class="choix-desc">1X2 · Handicap · O/U · 2 mi-temps</div>
        </a>

        <a href="/basketball" class="choix-btn">
            <span class="choix-emoji">🏀</span>
            <div class="choix-titre">Basketball</div>
            <div class="choix-desc">ML · Spread · Total · Q1-Q4</div>
        </a>

    </div>

    <a href="/historique" class="lien-historique">📊 Voir l'historique</a>

    <p class="version">Version 23.0 — 2026</p>

</body>
</html>
